[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-reader-mcp"
version = "0.2.0"
description = "MCP server for reading local and remote images"
readme = "README.md"
license = { text = "MIT" }
authors = [
    {name = "SeBeom Lee", email = "moses97@gmail.com"},
    {name = "Rinaldi Widianto", email = "64170577+arinanto@users.noreply.github.com"}
]
dependencies = [
    "mcp[cli]",
    "pillow",
    "requests"
]
requires-python = ">=3.12"

[tool.uv]
cache-dir = ".uv-cache"

[project.scripts]
image-reader-mcp = "image_reader_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.21.0",
]
