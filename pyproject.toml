[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-reader-mcp"
version = "0.1.0"
description = "MCP server for reading local and remote images"
authors = [{name = "SeBeom Lee", email = "moses97@gmail.com"}]
dependencies = [
    "mcp[cli]",
    "pillow",
    "requests"
]
requires-python = ">=3.12"


[project.scripts]
image-reader-mcp = "image_reader_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.21.0",
]
