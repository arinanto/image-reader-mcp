[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-reader-mcp"
version = "1.0.0rc1"
description = "MCP server for reading local and remote images"
readme = "README.md"
license = { text = "MIT" }
authors = [
    {name = "SeBeom Lee", email = "moses97@gmail.com"},
    {name = "Rinaldi Widianto", email = "64170577+arinanto@users.noreply.github.com"}
]
dependencies = [
    "mcp[cli]==1.18.0",
    "pillow==12.0.0",
    "requests==2.32.5"
]
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pyrefly==1.3.2",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]
